<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>aioredgif — Badge Preview</title>
  <link rel="stylesheet" href="/css/aioredgif.css">
  <link rel="stylesheet" href="/css/badges.css">
  <style>
    :root {
      --bg: #05030a;
      --fg: rgba(255,255,255,0.88);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .page-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 36px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 20px;
    }

    .page-header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
    }

    .page-header p {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
    }

    .tier-legend {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .tier-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
    }

    .tier-legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tier-legend-item.bronze .tier-legend-swatch { background: #cd7f32; box-shadow: 0 0 6px #cd7f32; }
    .tier-legend-item.silver .tier-legend-swatch { background: #c0c0c0; box-shadow: 0 0 6px #c0c0c0; }
    .tier-legend-item.gold   .tier-legend-swatch { background: #ffd700; box-shadow: 0 0 6px #ffd700; }
    .tier-legend-item.diamond .tier-legend-swatch { background: #a8f0ff; box-shadow: 0 0 6px #a8f0ff; }
    .tier-legend-item.locked  .tier-legend-swatch { background: rgba(255,255,255,0.15); }

    .tier-legend-label { color: rgba(255,255,255,0.65); }

    /* demo controls */
    .demo-controls {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .demo-controls label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .demo-controls select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.8);
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    .demo-controls button {
      background: rgba(255,20,147,0.18);
      border: 1px solid rgba(255,20,147,0.45);
      color: rgba(255,100,170,0.9);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .demo-controls button:hover { background: rgba(255,20,147,0.3); }
    .demo-controls button.secondary {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.55);
    }
    .demo-controls button.secondary:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1>aioredgif Badges</h1>
    <p>adults only · all 18 badges · 4 tiers each</p>
  </div>

  <div class="tier-legend">
    <div class="tier-legend-item bronze"><div class="tier-legend-swatch"></div><span class="tier-legend-label">Bronze — 1 heart · first threshold</span></div>
    <div class="tier-legend-item silver"><div class="tier-legend-swatch"></div><span class="tier-legend-label">Silver — 2 hearts · consistent</span></div>
    <div class="tier-legend-item gold">  <div class="tier-legend-swatch"></div><span class="tier-legend-label">Gold — 3 hearts · dedicated</span></div>
    <div class="tier-legend-item diamond"><div class="tier-legend-swatch"></div><span class="tier-legend-label">Diamond — 4 hearts · ascendant</span></div>
    <div class="tier-legend-item locked"><div class="tier-legend-swatch"></div><span class="tier-legend-label">Locked — not yet earned</span></div>
  </div>

  <div class="demo-controls">
    <label>Demo tier
      <select id="demoTier">
        <option value="bronze">Bronze</option>
        <option value="silver" selected>Silver</option>
        <option value="gold">Gold</option>
        <option value="diamond">Diamond</option>
      </select>
    </label>
    <button id="seedAll">Award all badges at selected tier</button>
    <button id="clearAll" class="secondary">Clear all earned</button>
    <button id="toastDemo">Test toast notification</button>
  </div>

  <div class="badges-section">
    <div id="badge-filter-bar">
      <button data-filter="all" class="active">All</button>
      <button data-filter="earned">Earned</button>
      <button data-filter="locked">Locked</button>
    </div>
    <div id="badges-grid"></div>
  </div>
</div>

<script src="/js/badges.js"></script>
<script>
  BadgeSystem.init();

  /* ── Demo controls ───────────────────────────────────────────── */

  document.getElementById('seedAll').addEventListener('click', () => {
    const tier = document.getElementById('demoTier').value;
    const now = Date.now();
    const state = BadgeSystem.loadBadgeState();
    const tierOrder = ['bronze', 'silver', 'gold', 'diamond'];
    for (const def of BadgeSystem.BADGE_DEFS) {
      const existing = state[def.id];
      const existingIdx = existing ? tierOrder.indexOf(existing.tier) : -1;
      const newIdx = tierOrder.indexOf(tier);
      if (newIdx > existingIdx) {
        BadgeSystem.awardBadge(def.id, tier,
          tier === 'diamond' ? 'Maximum devotion achieved.' :
          tier === 'gold'    ? 'Deeply committed.' :
          tier === 'silver'  ? 'Getting serious.' : 'First steps taken.');
      }
    }
    BadgeSystem.renderBadgesPanel();
  });

  document.getElementById('clearAll').addEventListener('click', () => {
    try { localStorage.removeItem('aioredgif_badges_v1'); } catch {}
    BadgeSystem.renderBadgesPanel();
  });

  document.getElementById('toastDemo').addEventListener('click', () => {
    const tier = document.getElementById('demoTier').value;
    const defs = BadgeSystem.BADGE_DEFS;
    const def = defs[Math.floor(Math.random() * defs.length)];
    BadgeSystem.showEarnedToast(def, tier);
  });
</script>
</body>
</html>
