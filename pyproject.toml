[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aioredgif"
version = "1.0.0"
description = "Async RedGIFs downloader with a library, player and goon cave. Adults only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "aioredgif contributors" }]
keywords = ["redgifs", "downloader", "fastapi", "asyncio", "playwright"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.39",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "ruff>=0.6", "playwright>=1.45"]

[project.scripts]
aioredgif = "aioredgif.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aioredgif"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
